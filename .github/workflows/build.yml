name: Build NetherSX2 (SingStar USB mic)

on:
  push:
    branches: [ main, master ]
    paths-ignore: [ '**.md', 'docs/**' ]
  pull_request:
    branches: [ main, master ]
    paths-ignore: [ '**.md', 'docs/**' ]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub Release'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fix git safe.directory (devkitPro container runs as different UID)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install devkitPro packages
        run: |
          dkp-pacman -Sy --noconfirm \
            switch-dev switch-mesa switch-curl \
            switch-zlib switch-libdrm_nouveau switch-mbedtls \
          || true

      - name: Cache cmake dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: launcher/dependencies/build
          key: deps-${{ runner.os }}-${{ hashFiles('launcher/dependencies/CMakeLists.txt', 'launcher/dependencies/**/*.cmake') }}

      - name: Build cmake dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          mkdir -p launcher/dependencies/build
          cd launcher/dependencies/build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/Switch.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -G "Unix Makefiles"
          make -j$(nproc)

      # ── GL renderer (always built) ─────────────────────────────────────────
      # TARGET is passed explicitly because the default is $(notdir $(CURDIR)),
      # which equals the repository/directory name and varies across forks.
      - name: Build GL
        run: make -j$(nproc) RENDERER=GL TARGET=NetherSX2_nx

      - name: Save GL NRO
        run: cp NetherSX2_nx.nro NetherSX2_nx_gl.nro

      # ── VK renderer (built only when vulkan-bundle release exists) ─────────
      # vulkan/ is built once by build-vulkan.yml and stored as a release asset
      # tagged "vulkan-bundle". If that release does not exist yet, VK is skipped.
      - name: Check for vulkan-bundle release
        id: vk_check
        run: |
          CODE=$(curl -sf -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/vulkan-bundle" \
            || echo "000")
          if [ "$CODE" = "200" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "No vulkan-bundle release found — skipping VK build."
            echo "Run the 'Build Vulkan bundle' workflow once to enable VK builds."
          fi

      - name: Download vulkan bundle
        if: steps.vk_check.outputs.available == 'true'
        run: |
          ASSET_URL=$(curl -sf \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/vulkan-bundle" \
            | grep -o '"browser_download_url":"[^"]*vulkan\.tar\.gz"' \
            | grep -o 'https://[^"]*')
          curl -sfL \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "$ASSET_URL" -o vulkan.tar.gz
          tar -xzf vulkan.tar.gz

      - name: Build VK
        if: steps.vk_check.outputs.available == 'true'
        run: |
          make clean
          make -j$(nproc) RENDERER=VK TARGET=NetherSX2_nx

      - name: Save VK NRO
        if: steps.vk_check.outputs.available == 'true'
        run: cp NetherSX2_nx.nro NetherSX2_nx_vk.nro

      # ── Rename and upload ──────────────────────────────────────────────────
      - name: Compute short SHA
        id: version
        run: |
          SHORT=$(git rev-parse --short HEAD)
          echo "short_sha=$SHORT" >> $GITHUB_OUTPUT
          TAG=$(git describe --tags --exact-match 2>/dev/null || true)
          if [ -z "$TAG" ]; then
            TAG="nightly-$SHORT"
            echo "prerelease=true"  >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Rename GL
        run: mv NetherSX2_nx_gl.nro "NetherSX2_nx-GL-${{ steps.version.outputs.short_sha }}.nro"

      - name: Rename VK
        if: steps.vk_check.outputs.available == 'true'
        run: mv NetherSX2_nx_vk.nro "NetherSX2_nx-VK-${{ steps.version.outputs.short_sha }}.nro"

      - name: Upload GL
        uses: actions/upload-artifact@v4
        with:
          name: NetherSX2_nx-GL-${{ steps.version.outputs.short_sha }}
          path: NetherSX2_nx-GL-${{ steps.version.outputs.short_sha }}.nro
          retention-days: 30

      - name: Upload VK
        if: steps.vk_check.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NetherSX2_nx-VK-${{ steps.version.outputs.short_sha }}
          path: NetherSX2_nx-VK-${{ steps.version.outputs.short_sha }}.nro
          retention-days: 30

  # ── Release ────────────────────────────────────────────────────────────────
  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
      || (github.event_name == 'workflow_dispatch' && inputs.release == true)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Compute tag
        id: version
        run: |
          SHORT=$(git rev-parse --short HEAD)
          TAG=$(git describe --tags --exact-match 2>/dev/null || true)
          if [ -z "$TAG" ]; then
            TAG="nightly-$SHORT"
            echo "prerelease=true"  >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "NetherSX2 ${{ steps.version.outputs.tag }} (SingStar USB mic)"
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          body: |
            ## NetherSX2 with SingStar USB microphone support

            Built from `${{ github.sha }}`.

            | File | Renderer |
            |------|----------|
            | `*-GL-*.nro` | OpenGL — always built |
            | `*-VK-*.nro` | Vulkan — built when vulkan-bundle release exists |

            ### SingStar mic setup
            Plug the adapter (VID `0x1415`) into a USB-A dock port or powered OTG hub.
            The mic appears automatically on PS2 USB Port 1.
          files: dist/*.nro
