name: Build NetherSX2 (SingStar USB mic)

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub Release from this build'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Build — GL and VK renderers compiled in parallel.
  #
  # GL and VK are mutually exclusive at link time (both bundle conflicting
  # copies of mesa util/nir/compiler object code).  They are built as two
  # independent jobs and shipped as two separate .nro files.
  # Users pick the one that matches their preferred renderer at launch.
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.renderer }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        renderer: [ GL, VK ]

    container:
      image: devkitpro/devkita64:latest

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ── 2. Install devkitPro packages ───────────────────────────────────────
      - name: Install devkitPro packages
        run: |
          dkp-pacman -Sy --noconfirm \
            switch-dev \
            switch-mesa \
            switch-curl \
            switch-zlib \
            switch-libdrm_nouveau \
            switch-mbedtls \
          || true

      # ── 3. Cache cmake dependencies (libsmb2 + libusbhsfs) ─────────────────
      - name: Cache cmake dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: launcher/dependencies/build
          key: deps-${{ runner.os }}-${{ hashFiles('launcher/dependencies/CMakeLists.txt', 'launcher/dependencies/**/*.cmake') }}

      - name: Build cmake dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          mkdir -p launcher/dependencies/build
          cd launcher/dependencies/build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/Switch.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -G "Unix Makefiles"
          make -j$(nproc)

      # ── 4. Build ─────────────────────────────────────────────────────────────
      - name: Build (RENDERER=${{ matrix.renderer }})
        run: make -j$(nproc) RENDERER=${{ matrix.renderer }}

      # ── 5. Rename output ─────────────────────────────────────────────────────
      - name: Rename output
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          NAME="NetherSX2_nx-${{ matrix.renderer }}-${SHORT_SHA}"
          mv NetherSX2_nx.nro ${NAME}.nro
          echo "ARTIFACT_NAME=${NAME}" >> $GITHUB_ENV
          echo "NRO_FILE=${NAME}.nro"  >> $GITHUB_ENV

      # ── 6. Upload artifact ───────────────────────────────────────────────────
      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.NRO_FILE }}
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  # Release — collects both NROs and publishes a GitHub Release.
  # Runs on push to main/master or when workflow_dispatch release=true.
  # ───────────────────────────────────────────────────────────────────────────
  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
      || (github.event_name == 'workflow_dispatch' && inputs.release == true)

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all NRO artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Compute version tag
        id: version
        run: |
          TAG=$(git describe --tags --exact-match 2>/dev/null || true)
          if [ -z "$TAG" ]; then
            TAG="nightly-${GITHUB_SHA::7}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          if [[ "$TAG" == nightly-* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "NetherSX2 ${{ steps.version.outputs.tag }} (SingStar USB mic)"
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          body: |
            ## NetherSX2 with SingStar USB microphone support

            Built from commit `${{ github.sha }}`.

            ### Which NRO should I use?

            | File | Renderer | When to use |
            |------|----------|-------------|
            | `*-GL-*.nro` | OpenGL (switch-mesa GLES) | Broadest compatibility, stable |
            | `*-VK-*.nro` | Vulkan (Mesa NVK) | Better performance on newer titles |

            GL and VK cannot be combined in a single NRO (they link conflicting
            copies of mesa internals). Choose one and rename it to
            `NetherSX2_nx.nro` on your SD card.

            ### SingStar mic setup
            1. Plug the SingStar adapter (VID `0x1415`) into a USB-A port on the dock,
               or via a **powered** USB-C OTG hub.
            2. Launch the emulator — the mic appears automatically on PS2 USB Port 1.
            3. Optional overrides in `sdmc:/switch/nethersx2/nethersx2.ini`:
               ```ini
               USB/Port1/Type = singstar
               USB/Port1/singstar/player1_volume = 240
               USB/Port1/singstar/player2_volume = 240
               ```
          files: dist/*.nro
