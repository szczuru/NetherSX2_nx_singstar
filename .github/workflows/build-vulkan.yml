name: Build Vulkan bundle

# Run this workflow ONCE (manually) to compile Mesa NVK for the Nintendo Switch.
# The result is stored as a release asset tagged "vulkan-bundle" in this repo.
# After that, the main build.yml picks it up automatically on every push.
#
# Build time: ~3-5 hours.  GitHub Actions free tier: 2000 min/month.

on:
  workflow_dispatch:
    inputs:
      nxvk_ref:
        description: 'nxvk branch/tag/commit to build from'
        default: 'switch'
        required: false
        type: string

jobs:
  build-vulkan:
    name: Build Mesa NVK for Switch
    runs-on: ubuntu-latest
    timeout-minutes: 300

    container:
      image: devkitpro/devkita64:latest

    permissions:
      contents: write

    steps:
      # ── 1. Checkout this repo into /repo (NOT /work — nxvk owns /work) ────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: repo

      - name: Fix git safe.directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/repo"
          git config --global --add safe.directory /work

      # ── 2. System packages ─────────────────────────────────────────────────
      - name: Install system packages
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            python3-pip bison flex curl ca-certificates pkg-config git \
            build-essential cmake ninja-build \
            llvm-15-dev clang-15 libclang-15-dev \
            libclc-15-dev libclc-15 \
            llvm-spirv-15 libllvmspirvlib-15-dev \
            libdrm-dev glslang-tools
          python3 -m pip install --break-system-packages --no-cache-dir \
            'meson>=1.4' mako pyyaml

      # ── 3. Build SPIRV-Tools >= 2024.1 from source ─────────────────────────
      # System package is 2023.x; Mesa 26 requires >= 2024.1.
      # Install to /usr/local so pkg-config finds it before the system version.
      - name: Cache SPIRV-Tools 2024.4
        id: spirv-cache
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/pkgconfig/SPIRV-Tools*.pc
          key: spirv-tools-2024.4-debian12-v1

      - name: Build and install SPIRV-Tools 2024.4
        if: steps.spirv-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b v2024.4 \
            https://github.com/KhronosGroup/SPIRV-Tools.git /tmp/spirv-src
          git clone --depth 1 -b vulkan-sdk-1.4.304.0 \
            https://github.com/KhronosGroup/SPIRV-Headers.git \
            /tmp/spirv-src/external/spirv-headers
          cmake -S /tmp/spirv-src -B /tmp/spirv-src/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DSPIRV_SKIP_TESTS=ON \
            -DSPIRV_WERROR=OFF \
            -DBUILD_SHARED_LIBS=ON \
            -G Ninja
          ninja -C /tmp/spirv-src/build -j$(nproc) install
          ldconfig

      - name: Set PKG_CONFIG_PATH for newer SPIRV-Tools
        run: |
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> $GITHUB_ENV
          pkg-config --modversion SPIRV-Tools

      # ── 4. Rust nightly ────────────────────────────────────────────────────
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --default-toolchain nightly --profile minimal \
              --component rust-src --component rustfmt
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Rust cargo tools
        run: |
          . "$HOME/.cargo/env"
          rustup target add aarch64-unknown-none
          cargo install --locked bindgen-cli cbindgen

      # ── 5. Clone nxvk into /work ───────────────────────────────────────────
      # nxvk cross-files hard-code /work as the repo root:
      #   rust.cross:      rust = ['/work/switch/rust/rustc-switch.sh']
      #   rustc-switch.sh: --sysroot /work/switch/rust/sysroot
      # The clone MUST be to /work, not /work/nxvk.
      - name: Clone nxvk into /work
        run: |
          git clone --depth 1 -b ${{ inputs.nxvk_ref }} \
            https://github.com/PalindromicBreadLoaf/nxvk.git /work

      # ── 6. Set up /opt/switch-cross-include ────────────────────────────────
      - name: Set up cross-include
        run: |
          mkdir -p /opt/switch-cross-include/libdrm
          cp /usr/include/xf86drm.h /usr/include/xf86drmMode.h \
             /opt/switch-cross-include/ 2>/dev/null || true
          cp -r /usr/include/libdrm/. /opt/switch-cross-include/ 2>/dev/null || true
          cp -r /usr/include/libdrm/. /opt/switch-cross-include/libdrm/ 2>/dev/null || true
          cp -r /work/switch/docker/cross-include/. /opt/switch-cross-include/

      # ── 7. Bake SPIR-V pkg-config into devkitPro search path ──────────────
      - name: Bake pkg-config files
        run: |
          XDIR=/opt/devkitpro/portlibs/switch/lib/pkgconfig
          mkdir -p "$XDIR"
          for name in libclc LLVMSPIRVLib SPIRV-Tools SPIRV-Tools-shared SPIRV-Headers; do
            f=$(find /usr/local/lib/pkgconfig /usr/lib/pkgconfig /usr/share/pkgconfig \
                  -name "$name.pc" 2>/dev/null | head -1)
            if [ -n "$f" ]; then
              cp "$f" "$XDIR/"
              echo "baked $f"
            fi
          done

      # ── 8. libdl.a stub ────────────────────────────────────────────────────
      - name: Create libdl.a stub
        run: |
          /opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar rcs \
            /opt/devkitpro/portlibs/switch/lib/libdl.a

      # ── 9. Build Rust sysroot for aarch64-switch-horizon ──────────────────
      # Must run BEFORE configure-mesa.sh — meson's Rust sanity check calls
      # rustc-switch.sh which requires the sysroot to exist.
      # We build only core+alloc+panic_abort (NOT std) because the target has
      # "std": false and "env": "newlib" — std::fs::unix uses AT_FDCWD which
      # newlib/Horizon does not expose on recent nightly Rust.
      # NAK (Mesa's Rust shader compiler) only needs core+alloc.
      - name: Build Rust sysroot
        working-directory: /work
        run: |
          . "$HOME/.cargo/env"
          export RUST_TARGET_PATH=/work/switch/rust
          export RUSTC_BOOTSTRAP=1
          export RUSTFLAGS="-Zunstable-options -L /opt/devkitpro/devkitA64/aarch64-none-elf/lib -L /opt/devkitpro/libnx/lib"
          TGT=aarch64-switch-horizon
          SYSROOT=/work/switch/rust/sysroot
          RUSTC_SYSROOT="$(rustc --print sysroot)"

          rm -rf /tmp/stdsr
          mkdir -p /tmp/stdsr/src
          echo '#![no_main]' > /tmp/stdsr/src/lib.rs
          cat > /tmp/stdsr/Cargo.toml << 'TOML'
          [package]
          name = "stdsr"
          version = "0.0.0"
          edition = "2021"
          [lib]
          crate-type = ["rlib"]
          [profile.release]
          panic = "abort"
          TOML

          cd /tmp/stdsr
          cargo +nightly build --release \
            -Zbuild-std=core,alloc,panic_abort \
            --target "$TGT"

          DEPS="/tmp/stdsr/target/$TGT/release/deps"
          rm -rf "$SYSROOT"
          mkdir -p "$SYSROOT/lib/rustlib/$TGT/lib"
          cp -f "$DEPS"/*.rlib  "$SYSROOT/lib/rustlib/$TGT/lib/" 2>/dev/null || true
          cp -f "$DEPS"/*.rmeta "$SYSROOT/lib/rustlib/$TGT/lib/" 2>/dev/null || true

          for d in "$RUSTC_SYSROOT/lib/rustlib"/*; do
            b=$(basename "$d")
            [ "$b" = "$TGT" ] && continue
            [ -e "$SYSROOT/lib/rustlib/$b" ] || \
              ln -s "$d" "$SYSROOT/lib/rustlib/$b" 2>/dev/null || true
          done
          ln -sf "$RUSTC_SYSROOT/lib/rustlib/src" "$SYSROOT/lib/rustlib/src" 2>/dev/null || true

          echo "=== sysroot rlibs ==="
          ls "$SYSROOT/lib/rustlib/$TGT/lib/" | grep -E "libcore|liballoc|libpanic"

          cd /tmp
          echo '#![no_std]' > t.rs
          echo '#![no_main]' >> t.rs
          echo 'pub fn f() -> usize { [1usize, 2, 3].len() }' >> t.rs
          rustc -Zunstable-options --target "$TGT" \
            --sysroot "$SYSROOT" \
            --crate-type=rlib -C panic=abort t.rs -o /tmp/t.rlib
          echo "SYSROOT TEST: OK"

      # ── 10. Build native tools ─────────────────────────────────────────────
      - name: Build native tools
        working-directory: /work
        run: |
          . "$HOME/.cargo/env"
          export LLVM_CONFIG=/usr/bin/llvm-config-15
          export LIBCLANG_PATH=/usr/lib/llvm-15/lib
          bash switch/build/build-native-tools.sh

      # ── 11. Configure Mesa cross-build ─────────────────────────────────────
      - name: Configure Mesa
        working-directory: /work
        run: |
          . "$HOME/.cargo/env"
          export LLVM_CONFIG=/usr/bin/llvm-config-15
          export LIBCLANG_PATH=/usr/lib/llvm-15/lib
          export PATH="/work/switch/build/native-tools/bin:$PATH"
          bash switch/build/configure-mesa.sh

      # ── 12. Cache Cargo artifacts ──────────────────────────────────────────
      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: nvk-cargo-${{ inputs.nxvk_ref }}-${{ hashFiles('/work/Cargo.lock') }}
          restore-keys: nvk-cargo-${{ inputs.nxvk_ref }}-

      # ── 13. Build Mesa NVK ─────────────────────────────────────────────────
      - name: Build Mesa NVK
        working-directory: /work
        run: |
          . "$HOME/.cargo/env"
          export LLVM_CONFIG=/usr/bin/llvm-config-15
          export LIBCLANG_PATH=/usr/lib/llvm-15/lib
          export PATH="/work/switch/build/native-tools/bin:$PATH"
          ninja -k0 -C switch/build/cross \
            src/nouveau/vulkan/libvulkan_nouveau.so || true
          echo "=== Archives produced ==="
          find switch/build/cross -name '*.a' | sort

      # ── 14. Package vulkan/ ────────────────────────────────────────────────
      - name: Package vulkan/ directory
        run: |
          set -eux
          BUILD=/work/switch/build/cross
          OUT=$GITHUB_WORKSPACE/repo/vulkan
          mkdir -p "$OUT/lib" "$OUT/include/vulkan"
          find /work/include/vulkan -name '*.h' -exec cp {} "$OUT/include/vulkan/" \;
          find "$BUILD" -name '*.a' -exec cp {} "$OUT/lib/" \;
          echo "=== vulkan/lib ==="
          ls -lh "$OUT/lib/"
          echo "=== vulkan/include/vulkan ==="
          ls "$OUT/include/vulkan/"
          test -f "$OUT/lib/libnvk.a" || { echo "ERROR: libnvk.a missing"; exit 1; }

      # ── 15. Publish as release asset ───────────────────────────────────────
      - name: Create vulkan.tar.gz
        working-directory: ${{ github.workspace }}/repo
        run: tar -czf vulkan.tar.gz vulkan/

      - name: Publish as vulkan-bundle release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vulkan-bundle
          name: "Vulkan bundle (Mesa NVK for Switch)"
          prerelease: true
          body: |
            Prebuilt Mesa NVK static archives for Nintendo Switch (AArch64 Horizon OS).

            Built from `PalindromicBreadLoaf/nxvk` ref `${{ inputs.nxvk_ref }}`.

            **Consumed automatically by `build.yml` — no manual download needed.**

            To update Mesa, re-run the **Build Vulkan bundle** workflow.
          files: ${{ github.workspace }}/repo/vulkan.tar.gz
