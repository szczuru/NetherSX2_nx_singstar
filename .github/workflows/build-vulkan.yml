name: Build Vulkan bundle

# Run this workflow ONCE (manually) to compile Mesa NVK for the Nintendo Switch.
# The result is stored as a release asset tagged "vulkan-bundle" in this repo.
# After that, the main build.yml picks it up automatically on every push.
#
# Build time: ~3-5 hours.  GitHub Actions free tier: 2000 min/month.

on:
  workflow_dispatch:
    inputs:
      nxvk_ref:
        description: 'nxvk branch/tag/commit to build from'
        default: 'switch'
        required: false
        type: string

jobs:
  build-vulkan:
    name: Build Mesa NVK for Switch
    runs-on: ubuntu-latest
    timeout-minutes: 300

    # devkitPro Docker image — devkitA64 + libnx already present, no apt
    # installer needed. Runs as root inside the container.
    container:
      image: devkitpro/devkita64:latest

    permissions:
      contents: write

    steps:
      # ── 1. Checkout (needed later for the release upload) ──────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # ── 2. Install build dependencies (mirrors nxvk Dockerfile) ───────────
      - name: Install system packages
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            python3-pip bison flex curl ca-certificates pkg-config git \
            build-essential cmake ninja-build \
            llvm-15-dev clang-15 libclang-15-dev \
            libclc-15-dev libclc-15 \
            llvm-spirv-15 libllvmspirvlib-15-dev spirv-tools \
            libdrm-dev glslang-tools
          python3 -m pip install --break-system-packages --no-cache-dir \
            'meson>=1.4' mako pyyaml

      # ── 3. Install Rust nightly ────────────────────────────────────────────
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --default-toolchain nightly --profile minimal \
              --component rust-src rustfmt
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Rust cargo tools
        run: |
          . "$HOME/.cargo/env"
          rustup target add aarch64-unknown-none
          cargo install --locked bindgen-cli cbindgen

      # ── 4. Clone nxvk ─────────────────────────────────────────────────────
      - name: Clone nxvk
        run: |
          git clone --depth 1 -b ${{ inputs.nxvk_ref }} \
            https://github.com/PalindromicBreadLoaf/nxvk.git /work/nxvk

      # ── 5. Set up /opt/switch-cross-include (mirrors Dockerfile) ──────────
      - name: Set up cross-include
        run: |
          mkdir -p /opt/switch-cross-include/libdrm
          cp /usr/include/xf86drm.h \
             /usr/include/xf86drmMode.h \
             /opt/switch-cross-include/ 2>/dev/null || true
          cp -r /usr/include/libdrm/. \
                /opt/switch-cross-include/ 2>/dev/null || true
          cp -r /usr/include/libdrm/. \
                /opt/switch-cross-include/libdrm/ 2>/dev/null || true
          cp -r /work/nxvk/switch/docker/cross-include/. \
                /opt/switch-cross-include/

      # ── 6. Bake SPIR-V pkg-config files into devkitPro search path ────────
      - name: Bake pkg-config files
        run: |
          XDIR=/opt/devkitpro/portlibs/switch/lib/pkgconfig
          mkdir -p "$XDIR"
          for name in libclc LLVMSPIRVLib SPIRV-Tools SPIRV-Tools-shared SPIRV-Headers; do
            f=$(find /usr -name "$name.pc" 2>/dev/null | head -1)
            if [ -n "$f" ]; then
              cp "$f" "$XDIR/"
              echo "baked $f"
            fi
          done

      # ── 7. Create empty libdl.a stub ───────────────────────────────────────
      - name: Create libdl.a stub
        run: |
          /opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar rcs \
            /opt/devkitpro/portlibs/switch/lib/libdl.a

      # ── 8. Build native tools (mesa_clc, glsl_compiler, etc.) ─────────────
      - name: Build native tools
        working-directory: /work/nxvk
        run: |
          . "$HOME/.cargo/env"
          export LLVM_CONFIG=/usr/bin/llvm-config-15
          export LIBCLANG_PATH=/usr/lib/llvm-15/lib
          bash switch/build/build-native-tools.sh

      # ── 9. Configure Mesa cross-build ──────────────────────────────────────
      - name: Configure Mesa
        working-directory: /work/nxvk
        run: |
          . "$HOME/.cargo/env"
          export LLVM_CONFIG=/usr/bin/llvm-config-15
          export LIBCLANG_PATH=/usr/lib/llvm-15/lib
          export PATH="/work/nxvk/switch/build/native-tools/bin:$PATH"
          bash switch/build/configure-mesa.sh

      # ── 10. Cache Rust/cargo artifacts ─────────────────────────────────────
      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: nvk-cargo-${{ inputs.nxvk_ref }}-${{ hashFiles('/work/nxvk/Cargo.lock') }}
          restore-keys: nvk-cargo-${{ inputs.nxvk_ref }}-

      # ── 11. Build Mesa NVK archives ────────────────────────────────────────
      # The final .so link fails by design (missing Switch libc symbols).
      # || true lets all .a archives build regardless.
      - name: Build Mesa NVK
        working-directory: /work/nxvk
        run: |
          . "$HOME/.cargo/env"
          export LLVM_CONFIG=/usr/bin/llvm-config-15
          export LIBCLANG_PATH=/usr/lib/llvm-15/lib
          export PATH="/work/nxvk/switch/build/native-tools/bin:$PATH"
          ninja -k0 -C switch/build/cross \
            src/nouveau/vulkan/libvulkan_nouveau.so || true
          echo "=== Archives produced ==="
          find switch/build/cross -name '*.a' | sort

      # ── 12. Package vulkan/ directory ──────────────────────────────────────
      # NetherSX2 Makefile expects:
      #   vulkan/include/vulkan/*.h
      #   vulkan/lib/*.a
      - name: Package vulkan/ directory
        run: |
          set -eux
          BUILD=/work/nxvk/switch/build/cross
          OUT=$GITHUB_WORKSPACE/vulkan
          mkdir -p "$OUT/lib" "$OUT/include/vulkan"

          find /work/nxvk/include/vulkan -name '*.h' \
            -exec cp {} "$OUT/include/vulkan/" \;

          find "$BUILD" -name '*.a' -exec cp {} "$OUT/lib/" \;

          echo "=== vulkan/lib ==="
          ls -lh "$OUT/lib/"
          echo "=== vulkan/include/vulkan ==="
          ls "$OUT/include/vulkan/"

          test -f "$OUT/lib/libnvk.a" || \
            { echo "ERROR: libnvk.a missing"; exit 1; }

      # ── 13. Publish as release asset ───────────────────────────────────────
      - name: Create vulkan.tar.gz
        run: tar -czf vulkan.tar.gz vulkan/

      - name: Publish as vulkan-bundle release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vulkan-bundle
          name: "Vulkan bundle (Mesa NVK for Switch)"
          prerelease: true
          body: |
            Prebuilt Mesa NVK static archives for Nintendo Switch (AArch64 Horizon OS).

            Built from `PalindromicBreadLoaf/nxvk` ref `${{ inputs.nxvk_ref }}`.

            **Consumed automatically by `build.yml` — no manual download needed.**

            To update Mesa, re-run the **Build Vulkan bundle** workflow.
          files: vulkan.tar.gz
