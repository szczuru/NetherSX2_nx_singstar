name: Build Vulkan bundle

# Run this workflow ONCE (manually) to compile Mesa NVK for the Nintendo Switch.
# The result is stored as a release asset tagged "vulkan-bundle" in this repo.
# After that, the main build.yml picks it up automatically on every push.
#
# Build time: ~3–5 hours.  GitHub Actions free tier: 2000 min/month.
# This workflow uses a standard ubuntu-latest runner (not devkitPro container)
# because the nxvk build system manages its own devkitA64 toolchain internally.

on:
  workflow_dispatch:
    inputs:
      nxvk_ref:
        description: 'nxvk branch/tag/commit to build from'
        default: 'switch'
        required: false
        type: string

jobs:
  build-vulkan:
    name: Build Mesa NVK for Switch
    runs-on: ubuntu-latest
    timeout-minutes: 300

    permissions:
      contents: write

    steps:
      # ── 1. Install system dependencies (mirrors Dockerfile) ────────────────
      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-pip bison flex curl ca-certificates pkg-config git \
            build-essential cmake ninja-build \
            llvm-15-dev clang-15 libclang-15-dev \
            libclc-15-dev libclc-15 \
            llvm-spirv-15 libllvmspirvlib-15-dev spirv-tools \
            libdrm-dev glslang-tools \
            p7zip-full wget
          python3 -m pip install --break-system-packages --no-cache-dir \
            'meson>=1.4' mako pyyaml

      # ── 2. Install devkitPro (devkitA64 + libnx) ──────────────────────────
      - name: Install devkitPro
        run: |
          wget -q https://apt.devkitpro.org/install-devkitpro-pacman
          chmod +x install-devkitpro-pacman
          sudo ./install-devkitpro-pacman
          sudo dkp-pacman -Sy --noconfirm switch-dev
          echo "DEVKITPRO=/opt/devkitpro" >> $GITHUB_ENV
          echo "DEVKITA64=/opt/devkitpro/devkitA64" >> $GITHUB_ENV
          echo "/opt/devkitpro/devkitA64/bin" >> $GITHUB_PATH

      # ── 3. Install Rust with aarch64 target ───────────────────────────────
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --default-toolchain nightly --profile minimal \
              --component rust-src rustfmt
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          source "$HOME/.cargo/env"
          rustup target add aarch64-unknown-none
          cargo install --locked bindgen-cli cbindgen

      # ── 4. Clone nxvk ─────────────────────────────────────────────────────
      - name: Clone nxvk
        run: |
          git clone --depth 1 -b ${{ inputs.nxvk_ref }} \
            https://github.com/PalindromicBreadLoaf/nxvk.git /work/nxvk

      # ── 5. Set up cross-include (mirrors Dockerfile RUN + COPY steps) ─────
      - name: Set up cross-include
        run: |
          sudo mkdir -p /opt/switch-cross-include/libdrm
          sudo cp /usr/include/xf86drm.h \
                  /usr/include/xf86drmMode.h \
                  /opt/switch-cross-include/ 2>/dev/null || true
          sudo cp -r /usr/include/libdrm/. \
                     /opt/switch-cross-include/ 2>/dev/null || true
          sudo cp -r /usr/include/libdrm/. \
                     /opt/switch-cross-include/libdrm/ 2>/dev/null || true
          # Copy nxvk's own cross-include stubs (equivalent of Dockerfile COPY)
          sudo cp -r /work/nxvk/switch/docker/cross-include/. \
                     /opt/switch-cross-include/

      # ── 6. Bake SPIR-V .pc files into devkitPro pkg-config dir ───────────
      - name: Bake pkg-config files
        run: |
          XDIR=/opt/devkitpro/portlibs/switch/lib/pkgconfig
          sudo mkdir -p "$XDIR"
          for name in libclc LLVMSPIRVLib SPIRV-Tools SPIRV-Tools-shared SPIRV-Headers; do
            f=$(find /usr -name "$name.pc" 2>/dev/null | head -1)
            if [ -n "$f" ]; then
              sudo cp "$f" "$XDIR/"
              echo "baked $f"
            fi
          done

      # ── 7. Create empty libdl.a ───────────────────────────────────────────
      - name: Create libdl.a stub
        run: |
          sudo /opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar rcs \
            /opt/devkitpro/portlibs/switch/lib/libdl.a

      # ── 8. Build native tools (host-side mesa_clc, glsl compiler, etc.) ──
      - name: Build native tools
        working-directory: /work/nxvk
        run: |
          export LLVM_CONFIG=/usr/bin/llvm-config-15
          export LIBCLANG_PATH=/usr/lib/llvm-15/lib
          export PATH="/work/nxvk/switch/build/native-tools/bin:$PATH"
          bash switch/build/build-native-tools.sh

      # ── 9. Configure Mesa cross-build ─────────────────────────────────────
      - name: Configure Mesa
        working-directory: /work/nxvk
        run: |
          export LLVM_CONFIG=/usr/bin/llvm-config-15
          export LIBCLANG_PATH=/usr/lib/llvm-15/lib
          export PATH="/work/nxvk/switch/build/native-tools/bin:$PATH"
          bash switch/build/configure-mesa.sh

      # ── 10. Cache Rust/cargo artifacts ────────────────────────────────────
      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /work/nxvk/switch/build
          key: nvk-cargo-${{ inputs.nxvk_ref }}-${{ hashFiles('/work/nxvk/Cargo.lock') }}
          restore-keys: nvk-cargo-${{ inputs.nxvk_ref }}-

      # ── 11. Build Mesa NVK ────────────────────────────────────────────────
      # The final .so link is expected to fail (missing Switch libc symbols).
      # We use || true to let all .a archives build regardless.
      - name: Build Mesa NVK archives
        working-directory: /work/nxvk
        run: |
          export LLVM_CONFIG=/usr/bin/llvm-config-15
          export LIBCLANG_PATH=/usr/lib/llvm-15/lib
          export PATH="/work/nxvk/switch/build/native-tools/bin:$PATH"
          ninja -k0 -C switch/build/cross \
            src/nouveau/vulkan/libvulkan_nouveau.so || true
          echo "Archives produced:"
          find switch/build/cross -name '*.a' | sort

      # ── 12. Package vulkan/ directory in NetherSX2 layout ─────────────────
      # NetherSX2 Makefile expects:
      #   vulkan/include/vulkan/vulkan_core.h  (+ other headers)
      #   vulkan/lib/*.a                        (all Mesa NVK archives)
      - name: Package vulkan/ directory
        run: |
          set -eux
          BUILD=/work/nxvk/switch/build/cross
          OUT=$GITHUB_WORKSPACE/vulkan
          mkdir -p "$OUT/lib" "$OUT/include/vulkan"

          # Vulkan headers from nxvk include tree
          find /work/nxvk/include/vulkan -name '*.h' \
            -exec cp {} "$OUT/include/vulkan/" \;

          # All Mesa static archives
          find "$BUILD" -name '*.a' -exec cp {} "$OUT/lib/" \;

          echo "=== vulkan/lib contents ==="
          ls -lh "$OUT/lib/"
          echo "=== vulkan/include/vulkan contents ==="
          ls "$OUT/include/vulkan/"

          # Sanity check: libnvk.a must exist
          if [ ! -f "$OUT/lib/libnvk.a" ]; then
            echo "ERROR: libnvk.a not found — build may have failed"
            exit 1
          fi

      # ── 13. Pack and publish as release asset ─────────────────────────────
      - name: Create vulkan.tar.gz
        run: tar -czf vulkan.tar.gz vulkan/

      - name: Publish as vulkan-bundle release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vulkan-bundle
          name: "Vulkan bundle (Mesa NVK for Switch)"
          prerelease: true
          body: |
            Prebuilt Mesa NVK static archives for Nintendo Switch (AArch64 Horizon OS).

            Built from `PalindromicBreadLoaf/nxvk` ref `${{ inputs.nxvk_ref }}`.

            **This release is consumed automatically by the main `build.yml` workflow.**
            You do not need to download it manually.

            To update Mesa, re-run the **Build Vulkan bundle** workflow.
          files: vulkan.tar.gz
